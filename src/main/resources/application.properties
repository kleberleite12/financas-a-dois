spring.application.name=financas-a-dois

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/financas_a_dois
spring.datasource.username=financas_app
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Usuários do aplicativo
app.kleber.password=${KLEBER_APP_PASSWORD}
app.giovanna.password=${GIOVANNA_APP_PASSWORD}