<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Detalhes | Finanças a Dois</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="container">

    <!-- ====================================== -->
    <!-- TOPO -->
    <!-- ====================================== -->

    <header class="topo">

        <div>

            <span class="marca">
                FINANÇAS A DOIS
            </span>

            <h1 th:text="${titulo}">
                Detalhes
            </h1>

            <p>

                <span th:text="${responsavel}">
                    Usuário
                </span>

                •

                <span th:text="${nomeMes}">
                    Mês
                </span>

                <span th:text="${ano}">
                    2026
                </span>

            </p>

        </div>


        <a class="botao-principal"
           th:href="@{/(
                ano=${anoVoltar},
                mes=${mesVoltar}
           )}">

            ← Voltar ao Dashboard

        </a>

    </header>


    <main>

        <!-- ====================================== -->
        <!-- TOTAL -->
        <!-- ====================================== -->

        <section class="destaques detalhes-total">

            <div class="card destaque saldo">

                <span>
                    Total
                </span>

                <strong th:text="${total}">
                    R$ 0,00
                </strong>

            </div>

        </section>


        <!-- ====================================== -->
        <!-- LANÇAMENTOS -->
        <!-- ====================================== -->

        <section class="tabela-container detalhes-container">

            <h2 th:text="${titulo}">
                Lançamentos
            </h2>


            <table class="tabela-detalhes"
                   th:if="${!lancamentos.isEmpty()}">

                <thead>

                <tr>

                    <th>
                        Descrição
                    </th>

                    <th>
                        Categoria
                    </th>

                    <th>
                        Valor
                    </th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="item : ${lancamentos}">

                    <td th:text="${item.descricao}">
                        Descrição
                    </td>


                    <td th:text="${item.categoria}">
                        Categoria
                    </td>


                    <td th:text="'R$ ' + ${#numbers.formatDecimal(
                        item.valor,
                        1,
                        'POINT',
                        2,
                        'COMMA'
                    )}">

                        R$ 0,00

                    </td>

                </tr>

                </tbody>

            </table>


            <div class="estado-vazio"
                 th:if="${lancamentos.isEmpty()}">

                Nenhum lançamento encontrado neste período.

            </div>

        </section>

    </main>

</div>

</body>

</html>
